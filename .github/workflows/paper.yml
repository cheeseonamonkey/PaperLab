name: Polymarket US paper and research
on:
  push:
    paths:
      - '.github/workflows/paper.yml'
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: 'Live paper polling duration (60-3300 seconds)'
        required: false
        type: number
        default: 90

permissions:
  contents: write

concurrency:
  group: yeno-us-persistent-state
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only PyTorch
        run: python -m pip install 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Preflight
        run: |
          python -m unittest discover -s tests -v
          python yeno.py check
      - name: Poll US order books and process 12 simulated portfolios
        env:
          DISPATCH_DURATION: ${{ inputs.duration_seconds }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            seconds="${DISPATCH_DURATION:-90}"
          elif [[ "$EVENT_NAME" == push ]]; then
            seconds=60
          else
            seconds=3000
          fi
          if [[ ! "$seconds" =~ ^[0-9]+$ ]] || (( seconds < 60 || seconds > 3300 )); then
            echo "Duration must be an integer from 60 to 3300 seconds"
            exit 2
          fi
          python yeno.py run --duration "$seconds"
      - name: Backfill three hours of US market and exogenous history
        if: always()
        timeout-minutes: 8
        run: python backfill.py
      - name: Train research candidate on all available settled data
        if: always()
        timeout-minutes: 6
        run: python train_research.py
      - name: Commit recoverable paper state and raw snapshots
        if: always()
        shell: bash
        run: |
          python yeno.py report
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p data/backfill data/training
          git add data/state.json data/observations data/backfill data/training REPORT.md README.md
          if ! git diff --cached --quiet; then
            git commit -m 'data: Polymarket US paper session [skip ci]'
            git push
          fi
