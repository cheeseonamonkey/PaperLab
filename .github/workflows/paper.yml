name: Paper Lab live research
on:
  push:
    paths:
      - '.github/workflows/paper.yml'
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: 'Live collection duration (60-3600 seconds)'
        type: number
        default: 90
permissions:
  contents: write
concurrency:
  group: yeno-us-persistent-state
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Refresh serialized repository state
        id: revision
        run: |
          git pull --ff-only origin "$GITHUB_REF_NAME"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify paper engine
        run: python -m unittest discover -s tests -v
      - name: Collect shared observations and settlement events
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_DURATION: ${{ inputs.duration_seconds }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            seconds="${DISPATCH_DURATION:-90}"
          elif [[ "$EVENT_NAME" == push ]]; then
            seconds=60
          else
            seconds=3600
          fi
          python parallel.py collect --duration "$seconds"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-batch
          overwrite: true
          path: |
            batch/
            data/observations/
          retention-days: 7
          if-no-files-found: warn

  bots:
    needs: collect
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.collect.outputs.revision }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: shared-batch
      - run: python parallel.py shard --index ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          overwrite: true
          path: shard-results/${{ matrix.shard }}.json
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: [collect, bots]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.collect.outputs.revision }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: shared-batch
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shard-results
          merge-multiple: true
      - name: Merge isolated account states
        id: merge
        run: python parallel.py merge
      - name: Import two-day bootstrap once
        timeout-minutes: 15
        run: python bootstrap.py
      - name: Backfill history
        if: always() && steps.merge.outcome == 'success'
        timeout-minutes: 8
        run: python backfill.py
      - name: Train research candidates
        if: always() && steps.merge.outcome == 'success'
        timeout-minutes: 6
        run: python train_research.py
      - name: Commit state, data and reports
        if: always() && steps.merge.outcome == 'success'
        run: |
          python paper.py report
          git switch -C "$GITHUB_REF_NAME"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p data/backfill data/bootstrap data/training data/ledgers docs
          git add data/state.json data/observations data/backfill data/bootstrap data/training data/ledgers docs REPORT.md README.md
          if ! git diff --cached --quiet; then
            git commit -m 'data: Polymarket US paper session [skip ci]'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
      - name: Preserve session if committing fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-session-${{ github.run_id }}
          overwrite: true
          path: |
            data/
            docs/
            REPORT.md
          retention-days: 7
