name: Paper Lab archive & research
on:
  push:
    paths:
      - '.github/workflows/paper.yml'
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      archive_only:
        description: 'Backfill Polymarket US market history instead of replay'
        type: boolean
        default: true
      run_research:
        description: 'Run the daily gated research proposal step'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: paperlab-hourly-state
  cancel-in-progress: false

jobs:
  archive:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.archive_only))
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - name: Refresh canonical archive state
        run: git pull --ff-only origin "$GITHUB_REF_NAME"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate archive collector
        run: python -m unittest discover -s tests -v
      - name: Download available historical BTC market hours
        run: python backfill.py
      - name: Save archive checkpoint and historical source data
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/backfill
          if ! git diff --cached --quiet; then
            git commit -m 'data: Polymarket US historical market archive [skip ci]'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Preserve interrupted archive data
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: archive-interrupted-${{ github.run_id }}
          path: data/backfill/
          retention-days: 7

  collect:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.archive_only == false))
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Refresh serialized repository state
        id: revision
        run: |
          git pull --ff-only origin "$GITHUB_REF_NAME"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify paper engine
        run: python -m unittest discover -s tests -v
      - name: Fetch previous closed hour and settlement events
        run: python parallel.py collect
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-batch
          overwrite: true
          path: |
            batch/
            data/observations/
            data/backfill/hours/
          retention-days: 7
          if-no-files-found: warn

  bots:
    needs: collect
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.collect.outputs.revision }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: shared-batch
      - run: python parallel.py shard --index ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          overwrite: true
          path: shard-results/${{ matrix.shard }}.json
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: [collect, bots]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.collect.outputs.revision }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: shared-batch
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shard-results
          merge-multiple: true
      - name: Merge isolated account states
        id: merge
        run: python parallel.py merge
      - name: Train research candidates
        if: always() && steps.merge.outcome == 'success'
        timeout-minutes: 6
        run: python train_research.py
      - name: Gate daily review-only research
        id: research_gate
        if: always() && steps.merge.outcome == 'success'
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_RESEARCH: ${{ inputs.run_research }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          day="$(date -u +%Y%m%d)"
          requested=false
          if [[ "$EVENT_NAME" == schedule || ( "$EVENT_NAME" == workflow_dispatch && "$RUN_RESEARCH" == true ) ]]; then
            if ! compgen -G "research/proposals/${day}T*.json" > /dev/null; then
              requested=true
            fi
          fi
          if [[ "$requested" == true && -n "$OPENROUTER_API_KEY" ]] && [[ "$(python research.py ready)" == ready ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipping optional Pi research: already proposed today, not requested, key unavailable, or fewer than 40 settled US markets.'
          fi
      - name: Install Pi
        id: install_pi
        if: steps.research_gate.outputs.ready == 'true'
        continue-on-error: true
        timeout-minutes: 5
        run: npm install -g @mariozechner/pi-coding-agent@0.73.1
      - name: Generate bounded review-only proposal
        if: steps.research_gate.outputs.ready == 'true' && steps.install_pi.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/yeno-research"
          python research.py prompt > "$RUNNER_TEMP/yeno-research/summary.json"
          cd "$RUNNER_TEMP/yeno-research"
          pi --provider openrouter --model openrouter/free --no-session --tools read --print \
            'Read summary.json and propose ONE practical next experiment. Output ONLY one JSON object with four string keys: title, hypothesis, evaluation, risks. No markdown. No real trading or execution commands.' \
            > "$RUNNER_TEMP/yeno-research/proposal.txt"
          cd "$GITHUB_WORKSPACE"
          python research.py evaluate "$RUNNER_TEMP/yeno-research/proposal.txt"
      - name: Commit state, data and reports
        if: always() && steps.merge.outcome == 'success'
        run: |
          python paper.py report
          git switch -C "$GITHUB_REF_NAME"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p data/backfill data/bootstrap data/training data/ledgers docs
          git add data/state.json data/observations data/backfill data/bootstrap data/training data/ledgers docs research/proposals strategies/roster.json REPORT.md README.md
          if ! git diff --cached --quiet; then
            git commit -m 'data: Polymarket US paper session [skip ci]'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Preserve session if committing fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-session-${{ github.run_id }}
          overwrite: true
          path: |
            data/
            docs/
            research/proposals/
            REPORT.md
          retention-days: 7
