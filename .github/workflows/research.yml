name: Optional Pi research proposals
on:
  schedule:
    - cron: '57 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yeno-us-persistent-state
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only research activation gate
        id: gate
        shell: bash
        run: |
          if [[ -n "$OPENROUTER_API_KEY" && "$(python research.py ready)" == ready ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipping Pi until OpenRouter key exists and 40 official US markets are resolved.'
          fi
      - name: Install Pi
        if: steps.gate.outputs.ready == 'true'
        run: npm install -g @mariozechner/pi-coding-agent@0.73.1
      - name: Generate bounded, non-deploying research proposal
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/yeno-research"
          python research.py prompt > "$RUNNER_TEMP/yeno-research/summary.json"
          cd "$RUNNER_TEMP/yeno-research"
          pi --provider openrouter --model openrouter/free --no-session --tools read --print \
            'Read summary.json and propose ONE practical next experiment. Output ONLY one JSON object with four string keys: title, hypothesis, evaluation, risks. No markdown. No real trading or execution commands.' \
            > "$RUNNER_TEMP/yeno-research/proposal.txt"
          cd "$GITHUB_WORKSPACE"
          python research.py evaluate "$RUNNER_TEMP/yeno-research/proposal.txt"
      - name: Save review-only proposal
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/proposals
          if ! git diff --cached --quiet; then
            git commit -m 'research: review-only Pi hypothesis [skip ci]'
            git push
          fi
