name: Tests
on:
  push:
    paths-ignore:
      - 'data/**'
      - 'docs/**'
      - 'research/proposals/**'
      - 'README.md'
      - 'REPORT.md'
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile paper.py feeds.py predictors.py research.py backfill.py train_research.py
      - run: python paper.py check
